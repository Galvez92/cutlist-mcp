<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cutlist-mcp — optimizador de corte</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="wrap topbar-inner">
        <div class="brand">
          <h1>cutlist-mcp</h1>
          <p>Optimizador de corte de tableros · demo</p>
        </div>
        <button id="reload" class="ghost" type="button">Cargar ejemplo</button>
      </div>
    </header>

    <main class="wrap">
      <section class="panel controls" aria-label="Ajustes de optimización">
        <label class="field">
          <span>Kerf (mm)</span>
          <input id="kerf" type="number" min="0" max="20" step="0.5" value="4" />
        </label>
        <label class="field check">
          <input id="rotate" type="checkbox" checked />
          <span>Permitir girar piezas</span>
        </label>
        <label class="field file">
          <span>Subir JSON de Cortecloud</span>
          <input id="file" type="file" accept=".json,application/json" />
        </label>
        <span id="status" class="status" role="status">Cargando muestra…</span>
      </section>

      <section id="summary" class="summary" aria-label="Resumen"></section>
      <div id="warnings" class="warnings"></div>
      <div id="groups" class="groups"></div>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
