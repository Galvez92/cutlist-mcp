# Entorno de desarrollo de cutlist-mcp (Base44).
#
# Esta rama entrega la capa de módulos paramétricos en TypeScript, que es una
# biblioteca. Para que el entorno tenga un punto de entrada visible en el puerto
# 3000, `web` sirve una vista previa de desarrollo con el servidor de
# `tools/preview/server.ts` (Node + tsx, sin framework).
#
# Ambos servicios montan el repositorio y no construyen imagen: cualquier edición
# del código se ve al instante, sin rebuild. `tsx watch` recarga el servidor al
# cambiar archivos; si no refresca, `docker compose restart web`.

name: cutlist-mcp

services:
  web:
    image: node:22-slim
    working_dir: /app
    command:
      - sh
      - -ec
      - npm install --no-audit --no-fund && exec ./node_modules/.bin/tsx watch tools/preview/server.ts
    environment:
      - PORT=3000
      - HOST=0.0.0.0
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    restart: on-failure
    labels:
      base44.project: "cutlist-mcp (vista previa de módulos paramétricos)"
      base44.kind: web
      base44.port: "3000"
    healthcheck:
      # Usa una ruta que ya existe (no se agregan endpoints para el chequeo).
      test:
        - CMD
        - node
        - -e
        - "const h=require('http');const r=h.get('http://127.0.0.1:3000/api/modulos',s=>{process.exit(s.statusCode===200?0:1)}).on('error',()=>process.exit(1));"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  tests:
    # Servicio de una sola corrida: vitest sobre el código montado.
    #   docker compose -f docker-compose.base44.yml --profile tests run --rm tests
    image: node:22-slim
    working_dir: /app
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec ./node_modules/.bin/vitest run"]
    environment:
      - CI=true
    volumes:
      - ./:/app
    profiles: ["tests"]
