# Entorno de desarrollo de Base44 para cutlist-mcp.
#
# Levanta el servidor MCP desde el código clonado (sin imágenes precompiladas):
#   docker compose -f docker-compose.base44.yml up -d --build
#   docker compose -f docker-compose.base44.yml exec mcp npm test
#
# El servicio expone en el puerto 3000:
#   /     página informativa del servidor (sirve de healthcheck)
#   /mcp  servidor MCP por Streamable HTTP
# Las dependencias se instalan al arrancar, desde package-lock.json, para que los
# cambios de código se vean sin reconstruir la imagen.

services:
  mcp:
    image: node:22
    working_dir: /app
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev:http"]
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      # El preview del sandbox llega con otro Host/Origin; el servidor sólo los
      # acepta cuando BASE44_PREVIEW_MODE vale exactamente "1" (ver src/http.ts).
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
    restart: on-failure
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    labels:
      base44.project: "cutlist-mcp (servidor MCP)"
      base44.kind: "api"
      base44.port: "3000"
      base44.docs: "/"

volumes:
  node_modules:
