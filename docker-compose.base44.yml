# Entorno de desarrollo Base44 para cutlist-mcp.
#
# Los formatos son TypeScript (sobre los tipos del motor, rama optimizer-engine)
# sin dependencias de ejecución. El servicio `web` corre desde el código clonado
# (bind mount), instala las dependencias de desarrollo al arrancar y sirve en el
# puerto 3000 la documentación del repo (tools/preview/server.ts). No hay
# secretos. Las pruebas se corren dentro del contenedor:
#   docker compose -f docker-compose.base44.yml exec -T web npm test
#   docker compose -f docker-compose.base44.yml exec -T web npm run typecheck
#
# Uso:  docker compose -f docker-compose.base44.yml up -d
#       docker compose -f docker-compose.base44.yml ps

name: cutlist-mcp

services:
  web:
    image: node:22
    working_dir: /app
    # Las dependencias de desarrollo viven en el volumen `node_modules`; se
    # instalan al arrancar, ya con el código montado, y luego arranca la vista.
    command:
      - sh
      - -ec
      - |
        npm install --no-audit --no-fund --prefer-offline
        exec npx tsx watch tools/preview/server.ts
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=3000
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    healthcheck:
      # /health responde 200: comprueba que el proceso responde.
      test:
        - CMD-SHELL
        - "node -e \"require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: on-failure
    labels:
      base44.project: "cutlist-mcp (formatos + documentación)"
      base44.kind: "web"
      base44.port: "3000"

volumes:
  node_modules:
