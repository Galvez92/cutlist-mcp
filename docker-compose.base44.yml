# Entorno de desarrollo Base44 para cutlist-mcp.
#
# Levanta la demo web (Vite) desde el código clonado del repo, no desde una imagen
# preconstruida: el repo se monta en /app y las dependencias se instalan al arrancar
# (`npm install` en la raíz del monorepo, con el lockfile versionado).
#
#   docker compose -f docker-compose.base44.yml up -d
#   docker compose -f docker-compose.base44.yml exec -T web npm test
#
services:
  web:
    # Imagen de runtime (no la imagen publicada del proyecto) para que cada edición
    # del código se vea con recarga en vivo.
    image: node:22-bookworm-slim
    working_dir: /app
    command:
      - sh
      - -ec
      - |
        npm install --no-audit --no-fund --prefer-offline
        exec npm run dev
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    environment:
      - BASE44_PREVIEW_MODE
      # Vite 6.1+ acepta hosts extra de este variable (el subdominio del sandbox rota).
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=.${BASE44_SANDBOX_HOST_DOMAIN}
    ports:
      - "3000:5173" # única entrada pública: el servidor de desarrollo de Vite
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    restart: on-failure
    labels:
      - base44.project=Demo web (optimizador de corte)
      - base44.kind=web
      - base44.port=3000

volumes:
  node_modules:
