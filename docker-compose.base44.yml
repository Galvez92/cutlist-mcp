# Entorno de desarrollo Base44 para cutlist-mcp.
#
# Levanta la demo web (Vite) desde el código clonado del repo, no desde una imagen
# preconstruida: el repo se monta en /app y las dependencias se instalan al arrancar
# (`npm install` en la raíz del monorepo, con el lockfile versionado).
#
#   docker compose -f docker-compose.base44.yml up -d
#   docker compose -f docker-compose.base44.yml exec -T web npm test
#
services:
  web:
    # Imagen de runtime (no la imagen publicada del proyecto) para que cada edición
    # del código se vea con recarga en vivo.
    image: node:22-bookworm-slim
    working_dir: /app
    command:
      - sh
      - -ec
      - |
        npm install --no-audit --no-fund --prefer-offline
        exec npm run dev
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    environment:
      - BASE44_PREVIEW_MODE
      # Vite 6.1+ acepta hosts extra de este variable (el subdominio del sandbox rota).
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=.${BASE44_SANDBOX_HOST_DOMAIN}
    ports:
      - "3000:5173" # única entrada pública: el servidor de desarrollo de Vite
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    restart: on-failure
    labels:
      - base44.project=Demo web (optimizador de corte)
      - base44.kind=web
      - base44.port=3000

  # Servidor MCP (rama mcp-server): / informativa y /mcp por Streamable HTTP, puerto público 3001.
  mcp:
    image: node:22
    working_dir: /app
    command: ["sh", "-ec", "npm install --no-audit --no-fund --prefer-offline && exec npm run dev:http"]
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    env_file:
      # Nombres de Host/Origin que acepta /mcp (MCP_ANFITRIONES, MCP_ORIGENES).
      # Versionado y vacío por defecto: sin valores sólo pasa localhost.
      - ./.env.base44-defaults
      # Valores cargados desde el panel de Base44; si define la misma clave, gana.
      - path: /run/base44/app.env
        required: false
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      # El preview del sandbox llega con otro Host/Origin; el servidor sólo los
      # acepta cuando BASE44_PREVIEW_MODE vale exactamente "1" (ver src/http.ts).
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
    restart: on-failure
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    labels:
      base44.project: "cutlist-mcp (servidor MCP)"
      base44.kind: "api"
      base44.port: "3001"
      base44.docs: "/"

volumes:
  node_modules:
