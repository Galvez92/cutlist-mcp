# Entorno de desarrollo Base44 para cutlist-mcp.
#
# El motor es TypeScript sin dependencias de ejecución. El servicio `web` corre
# desde el código clonado (bind mount) con recarga por `tsx` y sirve en el
# puerto 3000 una vista de desarrollo que ejecuta el motor sobre un pedido de
# ejemplo (ver tools/preview/server.ts). No hay secretos: el motor no usa
# servicios externos.
#
# Uso:  docker compose -f docker-compose.base44.yml up -d
#       docker compose -f docker-compose.base44.yml exec -T web npm test

services:
  web:
    image: node:22
    working_dir: /app
    # Las dependencias de desarrollo viven en el volumen `node_modules`; se
    # instalan al arrancar, ya con el código montado, y luego arranca la vista.
    command:
      - sh
      - -ec
      - |
        npm install --no-audit --no-fund --prefer-offline
        exec npx tsx watch tools/preview/server.ts
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=3000
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    healthcheck:
      # /health ejecuta el motor sobre el pedido de ejemplo: comprueba que el
      # proceso responde y que el motor realmente calcula.
      test:
        ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: on-failure
    labels:
      base44.project: "cutlist-mcp (motor + vista de desarrollo)"
      base44.kind: "web"
      base44.port: "3000"

volumes:
  node_modules:
