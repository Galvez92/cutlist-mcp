name: CI

# Usa la misma versión de Node que `.nvmrc` (la que exige jsdom 30.x vía undici).
# Con Node 20 los tests de jsdom (`demo/tests/app/`) no arrancan.
on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
