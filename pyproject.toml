[project]
name = "cutlist-mcp"
version = "0.1.0"
description = "Optimizador de corte de tableros open-source con módulos paramétricos"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "cutlist", "cutlist.modules"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
